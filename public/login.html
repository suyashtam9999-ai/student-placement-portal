<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — PlacementPrep</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="brand"><span class="dot"></span> PlacementPrep</a>
    <div class="nav-links">
      <a href="register.html">New here? Register</a>
    </div>
  </div>
</nav>

<main>
  <div class="container">
    <div class="auth-wrap card">
      <h2>Welcome back</h2>
      <p class="helper-text mb-24">Log in to continue your placement prep.</p>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@college.edu" />

        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />

        <div id="form-error" class="error-text hidden"></div>

        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p class="helper-text text-center mt-16">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
